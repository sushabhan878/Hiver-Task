# Pre-commit hooks — mirrors .gitignore and enforces the same gates as CI.
# Install once:  pip install -r requirements-dev.txt && pre-commit install
# Run manually:   pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^data/|^cache/|^reports/|\.jsonl$
      - id: end-of-file-fixer
        exclude: ^data/|^cache/|^reports/|\.jsonl$
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^data/
      - id: check-json
        exclude: ^data/|^cache/|^reports/|\.jsonl$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        exclude: ^data/|^cache/
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [types-pyyaml, types-requests]

  # Markdown/YAML layer (Python is handled by ruff above)
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        types_or: [markdown, yaml]
        exclude: ^data/|^cache/|^reports/
