[project]
name = "supportpilot"
version = "0.1.0"
description = "Evidence-grounded customer-support agent for the Customer Support on Twitter dataset (AmazonHelp). Runs fully locally via Ollama; evaluation-first and reproducible."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "SupportPilot contributors" }]
requires-python = ">=3.11"
keywords = ["customer-support", "llm", "rag", "evaluation", "ollama", "nlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.14",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "types-pyyaml>=6.0",
  "types-requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/your-org/supportpilot"
Repository = "https://github.com/your-org/supportpilot"
Issues = "https://github.com/your-org/supportpilot/issues"
Changelog = "https://github.com/your-org/supportpilot/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# build: the project runs from the repo root (src/ layout with implicit
# namespace), so there is deliberately no packaging build config yet.
# ---------------------------------------------------------------------------

# ------------------------------- tooling ----------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["cache", "data", "reports", "notebooks"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort (import order)
  "B",    # flake8-bugbear (likely bugs)
  "UP",   # pyupgrade (modernize)
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
]
ignore = [
  # tests/scripts import after sys.path bootstrap; kept intentionally
  "E402",
]

[tool.ruff.lint.per-file-ignores]
# scripts allow prints; notebooks are not linted
"scripts/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: end-to-end stages that hit Ollama or rebuild caches (deselected by default in CI)",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
